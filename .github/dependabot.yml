# Dependabot configuration
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # JavaScript/TypeScript dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
      - 'javascript'
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
    ignore:
      # TypeScript 7 is the native port: its npm package exports only
      # `version` and `versionMajorMinor`, so the compiler JS API that
      # svelte-check, typescript-eslint and svelte2tsx are built on is gone.
      # All three still cap at TypeScript 6 (typescript-eslint's canary too),
      # and this project never runs `tsc` — svelte-check does the type
      # checking and Vite the transpiling — so there is nothing to gain and
      # `check` plus `lint` to lose. Drop this once svelte-check and
      # typescript-eslint declare a TypeScript 7 peer.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      svelte:
        patterns:
          - 'svelte'
          - 'svelte-*'
          - '@sveltejs/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'prettier-plugin-tailwindcss'
      flowbite:
        patterns:
          - 'flowbite'
          - 'flowbite-*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      prettier:
        patterns:
          - 'prettier'
          - 'prettier-*'
          - 'eslint-config-prettier'
      d3:
        patterns:
          - 'd3-*'
          - '@types/d3-*'
      types:
        patterns:
          - '@types/*'
        exclude-patterns:
          - '@types/d3-*'

  # GitHub Actions used in workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '06:00'
      timezone: 'Europe/Berlin'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      actions:
        patterns:
          - '*'
